services:
  - type: web
    name: guest-flow-manager
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --ignore-scripts && pnpm --filter @workspace/limpeza build
    startCommand: node --max-old-space-size=400 server.mjs
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
