                  description: Property ID on your PMS
                  type: string
                  minimum: 1
                wbp_property_id:
                  description: |
                    Username, WebBookingPro Property ID
                  type: string
                shared_secret:
                  description: >-
                    Authentication between the OTA and the channel. Identical
                    for all requests. Not to be shared with customers.
                  type: string
              required:
                - shared_secret
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    UpdateId: 99277138491
                Failure:
                  summary: Failure
                  value:
                    ErrorCode: 1031
                    Error: Channel not enabled for property
              schema:
                oneOf:
                  - title: Successful request
                    type: object
                    properties:
                      UpdateId:
                        type: integer
                        minimum: 1
                        description: >
                          If present indicates that at least one full refresh
                          was enqueued into PMS to be sent to the WebBookingPro
                  - $ref: '#/components/schemas/response_callback_error'
          description: ARIFullRefresh
      summary: ARIFullRefresh
      tags:
        - Callbacks
  /BookingCreate:
    post:
      operationId: booking_create
      description: >-
        *Note that the endpoint for this API call is on your PMS!*


        WebBookingPro uses this callback to send us new bookings to your PMS.
        Using this callback ensures that

        there is no delay between the creation of the booking and import on

        PMS. Therefore it's strongly recommend to implement this callback.

        Even when implemented it's still necessary to also implement the

        `GetBookingList` and `GetBookingId` calls, which act as fallbacks if

        the `CreateBooking` notification fails, when a reimport due to
        processing

        issues on PMS is necessary, or when a specific booking needs to be

        debugged.


        The booking format is identical to what is being returned in the

        `GetBookingId` call. The booking format is described

        [here in full detail]().


        See the documentation about `GetBookingId` for more details on the
        format.

        The specification listed here is not complete and just the minimal

        requirement.
      servers:
        - url: >-
            your_endpoint_url e.g.
            (https://yourcloudpms.com/api/callback/webookingpro)
      requestBody:
        content:
          application/json:
            examples:
              BookingCreate:
                summary: BookingCreate
                value:
                  pms_property_id: '998201'
                  wbp_property_id: 111
                  shared_secret: s3cr3ts4uc3
                  reservation:
                    OrderId: 123456789
                    OrderDate: '2018-04-22'
                    OrderTime: '18:02:58'
                    IsCancellation: 0
                    TotalCurrency: USD
                    TotalPrice: 134
                    Customers:
                      - CustomerCountry: US
                        CustomerEmail: test@test.com
                        CustomerFName: Test Firstname
                        CustomerLName: Test Lastname
                    Rooms:
                      - ChannelRoomType: 111
                        Currency: USD
                        DayRates:
                          - Date: '2017-11-08'
                            Description: Refundable Rate
                            Rate: 32.5
                            Currency: USD
                            RateId: 13649
                          - Date: '2017-11-09'
                            Description: Refundable Rate
                            Rate": 34.5
                            Currency: USD
                            RateId: 13649
                        StartDate: '2017-11-08'
                        EndDate: '2017-11-09'
                        Price: 134
                        Units: 2
            schema:
              type: object
              properties:
                pms_property_id:
                  description: Property ID on your PMS
                  type: string
                  minimum: 1
                wbp_property_id:
                  description: WebBookingPro Property ID
                  type: string
                shared_secret:
                  description: >-
                    Authentication between the OTA and the channel. Identical
                    for all requests. Not to be shared with customers.
                  type: string
                reservation:
                  type: object
                  description: >
                    The booking payload. See the response for `GetBookingId` for
                    a minimal example and check the "Booking Format" section of
                    this documentation.
              required:
                - shared_secret
                - booking
            encoding:
              booking_json:
                contentType: application/json
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value: {}
                Failure:
                  summary: Failure
                  value:
                    Error: 1031
                    ErrorMsg: Channel not enabled for property
              schema:
                oneOf:
                  - title: Successful Request
                    type: object
                    description: >
                      No returned error means the booking has been enqueued into
                      PMS for import. The response will be an empty JSON object.
                  - $ref: '#/components/schemas/response_callback_error'
          description: BookingCreate
      summary: BookingCreate
      tags:
        - Callbacks
  /NotifyBooking:
    post:
      operationId: notify_booking
      description: >-
        *Note that the endpoint for this API call is on your PMS!*


        With this API call the WebBookingPro can notify PMS to immediately
        request a

        `GetBookingList` call based on the `wbp_property_id`

        and the passed `booking_id`. This should be send on any new booking OR
        any

        changes such as cancellations to an existing booking.


        If the `BookingCreate` API call has been implemented then
        `NotifyBooking`

        is not required.
      servers:
        - url: >-
            your_endpoint_url e.g.
            (https://yourcloudpms.com/api/callback/webookingpro)
      requestBody:
        content:
          application/x-www-form-urlencoded:
            examples:
              NotifyBooking:
                summary: NotifyBooking
                value:
                  wbp_property_id: 111
                  shared_secret: s3cr3ts4uc3
                  booking_id: '123456789'
            schema:
              type: object
              properties:
                wbp_property_id:
                  description: WebBookingPro Property ID
                  type: integer
                booking_id:
                  type: integer
                  description: WebBookingPro booking ID of the booking to be retrieved.
                shared_secret:
                  description: >-
                    Authentication between the WebBookingPro and PMS. Identical
                    for all requests. Not to be shared with customers.
                  type: string
              required:
                - shared_secret
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value: {}
                Failure:
                  summary: Failure
                  value:
                    Error: 1031
                    ErrorMsg: Channel not enabled for property
              schema:
                oneOf:
                  - title: Successful Request
                    type: object
                    description: >
                      No returned error means the notification has been enqueued
                      into PMS for import. The response will be an empty JSON
                      object.
                  - $ref: '#/components/schemas/response_callback_error'
          description: NotifyBooking
      summary: NotifyBooking
      tags:
        - Callbacks
  /RoomInfo:
    post:
      operationId: room_info
      description: >-
        *Note that the endpoint for this API call is on your PMS!*


        Returns the rooms configured on your PMS. It's only necessary for deep

        integrations or situations where the WebBookingPro plans to
        automatically/create

        destroy rooms using PMS's configuration. In a normal integration this

        isn't very common.
      servers:
        - url: >-
            your_endpoint_url e.g.
            (https://yourcloudpms.com/api/callback/webookingpro)
      requestBody:
        content:
          application/json:
            examples:
              RoomInfo:
                summary: RoomInfo
                value:
                  pms_property_id: '998201'
                  shared_secret: s3cr3ts4uc3
            schema:
              type: object
              properties:
                pms_property_id:
                  description: Property ID on the your PMS
                  type: string
                  minimum: 1
                shared_secret:
                  description: >-
                    Authentication between the OTA and the channel. Identical
                    for all requests. Not to be shared with customers.
                  type: string
              required:
                - pms_property_id
                - shared_secret
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    RoomInfo:
                      - pms_room_id: 45829
                        units: 5
                        beds: 2
                        dormitory: false
                        label: Double Room
                        description: A potentially long description about the room
                      - pms_room_id: 290
                        units: 25
                        beds: 4
                        dormitory: false
                        label: 4-person private
                        description: null
                Failure:
                  summary: Failure
                  value:
                    ErrorCode: 9203
                    Error: pms_property_id is invalid
              schema:
                oneOf:
                  - title: Successful Request
                    type: object
                    properties:
                      RoomInfo:
                        type: array
                        description: |
                          List of rooms configured on your PMS.
                        items:
                          $ref: '#/components/schemas/room_info'
                    required:
                      - RoomInfo
                  - $ref: '#/components/schemas/response_callback_error'
          description: RoomInfo
      summary: RoomInfo
      tags:
        - Callbacks
components:
  securitySchemes:
    shared_secret:
      type: apiKey
      in: query
      name: shared_secret
      description: >-
        Authentication between the PMS and the WebBookingPro. Identical for all
        requests. Not to be shared with customers.
  schemas:
    response_simple:
      type: object
      title: Standard Response
      properties:
        errors:
          description: Array of error objects. Required when `success` is `false`.
          type: array
          items:
            description: Error object
            type: object
            properties:
              id:
                type: integer
                minimum: 1
                description: >
                  Error code. Check the "Error Codes" section of the
                  specification for valid codes.
              msg:
                type: string
                description: >
                  Optional error string to give more details about the error.
                  Myallocator localises errors into different languages, so this
                  field is generally ignored and only useful for debugging.
            required:
              - id
        success:
          type: boolean
          enum:
            - true
            - false
      required:
        - success
    room_info:
      type: object
      properties:
        pms_room_id:
          type: integer
          minimum: 1
          description: Room ID on the your PMS
        units:
          type: integer
          minimum: 1
          description: How many rooms of this type there are.
        maxPersons:
          type: integer
          minimum: 1
          description: Number people that can stay in this room.
        maxAdults:
          type: integer
          minimum: 1
          description: Number of adults that can stay in this room.
        maxChildren:
          type: integer
          minimum: 1
          description: Number of children that can stay in this room.
        dormitory:
          type: boolean
          description: |
            If `true` it's a dormitory (shared room), `false` for private rooms.
        pricingModel:
          type: string
          description: >
            Pricing Model. It can be "occ" for occupancy (default), "pax" for
            per adult person, "room" for per room/unit, "dormitory", "camp" for
            campsites (plot + per persons)
                    
        label:
          type: string
          description: |
            Short string that describes the room for displaying purposes.
        description:
          type:
            - string
            - 'null'
          description: >
            Longer description of the room which describes a room to a potential
            guest.
      required:
        - pms_room_id
        - units
        - beds
        - dormitory
        - label
        - description
    auth:
      type: object
      properties:
        pms_property_id:
          description: Property ID on the your PMS
          type: integer
          minimum: 1
        wbp_property_id:
          description: Username, login or property ID on the OTA
          type: string
        wbp_property_password:
          description: Password for property on WebBookingPro
          type: string
        guid:
          description: Request reference ID, used for debugging and support requests.
          type: string
          pattern: ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        shared_secret:
          description: >-
            Authentication between the PMS and the WebBookingPro. Identical for
            all requests. Not to be shared with customers.
          type: string
        pms_cid:
          description: PMS ID as given by WebBookingPro
          type: string
          pattern: ^[a-z0-9]+$
      required:
        - guid
        - pms_property_id
        - wbp_property_id
        - wbp_property_password
        - shared_secret
        - pms_cid
    response_error:
      type: object
      title: Error Response
      properties:
        errors:
          description: Array of error objects.
          type: array
          items:
            description: Error object
            type: object
            properties:
              id:
                type: integer
                minimum: 1
                description: >
                  Error code. Check the "Error Codes" section of the
                  specification for valid codes.
              msg:
                type: string
                description: >
                  Optional error string to give more details about the error.
                  Myallocator localises errors into different langauges, so this
                  field is generally ignored and only useful for debugging.
            required:
              - id
        success:
          type: boolean
          enum:
            - false
      required:
        - errors
        - success
    booking:
      type: object
      description: >
        Object describing the booking. The fields listed here are just the
        minimum required fields.
      properties:
        OrderId:
          type: string
          description: Unique booking ID on the OTA. Maximum of 64 characters.
        OrderAdults:
          type: integer
          minimum: 0
          description: >
            Total number of unique adults. Adult age threshold is defined by the
            channel. Should equal sum of Adults in each room if this breakdown
            is given.
        OrderChildren:
          type: integer
          minimum: 0
          description: >
            Total number of unique children or babies. Child/baby age threshold
            is defined by the channel. Should equal sum of `Children` plus
            `Babies` in each room if this breakdown is given.
        OrderCustomers:
          type: integer
          minimum: 1
          description: >
            Total number of unique customers. Should equal sum of `Occupancy` in
            each room if this breakdown is given. Should also equal the sum of
            `OrderAdults` and `OrderChildren` if those fields are present.
        OrderDate:
          type: string
          format: date
          description: Date of booking creation, in UTC (not date when modified!).
        OrderTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
          description: >
            Time of booking creation, in UTC. If seconds are not provided, set
            value to ":00". Presence of `OrderTime` requires presence of
            `OrderDate`.
        OrderModifDate:
          type: string
          format: date
          description: >
            Date of booking modification, in UTC. Do not pass if booking has not
            been modified.
        OrderModifTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
          description: >
            Time of booking modification, in UTC. Do not pass if booking has not
            been modified. If seconds are not provided, set value to ":00".
        IsCancellation:
          type: integer
          enum:
            - 0
            - 1
          description: '`1` if booking is cancelled.'
        IsModification:
          type: integer
          enum:
            - 0
            - 1
          description: '`1` if booking is modified.'
        TotalCurrency:
          type: string
          pattern: ^[A-Z]{3}$
          description: |
            3-letter ISO 4217 currency code for the `TotalPrice` field.
        TotalPrice:
          type: number
          description: >
            Total price of the booking, including taxes, commission and deposit,
            after discounts. It should reflect the price the guest will have to
            pay in total (or has already paid).
        PaymentCollect:
          type: string
          enum:
            - Property
            - Channel
          description: >
            Who collects outstanding balance from the guest? `Property` means
            that the property takes the payment, either by charging the credit
            card, or on arrival. `Channel` means that the channel will take the
            payment, and the property is paid by the channel. Do not set this to
            `Channel` if you are only collecting the commission/deposit.
        Customers:
          type: array
          items:
            type: object
            properties:
              CustomerCountry:
                type: string
                pattern: ^[A-Z]{2}$
                description: >-
                  2-letter ISO 3166-1 alpha-2 country code in which the customer
                  resides, corresponding to their address. Value is uppercase.
              CustomerEmail:
                type: string
                format: email
                description: Email address of the customer.
              CustomerFName:
                type: string
                description: >
                  First name(s) of the customer. If the name is not stored
                  separated by first and last name, provide full name in
                  `CustomerLName`.
              CustomerLName:
                type: string
                description: Last (family) name or full name of the customer.
            required:
              - CustomerCountry
              - CustomerEmail
              - CustomerFName
              - CustomerLName
        Rooms:
          type: array
          description: List of rooms booked
          items:
            type: object
            properties:
              Adults:
                type: integer
                minimum: 0
                description: >
                  Number of adults staying in this room. Adult age threshold is
                  defined by the channel.
              Babies:
                type: integer
                minimum: 0
                description: >
                  Number of babies staying in this room. Baby age threshold is
                  defined by the channel.
              ChannelRoomType:
                type: string
                description: The ID of the room on the OTA.
              Children:
                type: integer
                minimum: 0
                description: >
                  Number of children staying in this room. Child age threshold
                  is defined by the channel.
              Currency:
                type: string
                pattern: ^[A-Z]{3}$
                description: |
                  3-letter ISO 4217 currency code for the `Price` field.
              DayRates:
                type: array
                description: >
                  Contains as many objects as the number of nights of the room
                  stay. They need to be sorted by date.
                items:
                  type: object
                  properties:
                    Date:
                      type: string
                      format: date
                      description: Date of day rate.
                    Description:
                      type: string
                      description: >
                        Name or short description of the rateplan booked.
                        Example: "Non-refundable rate" or "10% festival
                        discount".
                    Rate:
                      type: number
                      description: |
                        Price for this day, including `Commission` and `Tax`.
                    Currency:
                      type: string
                      pattern: ^[A-Z]{3}$
                      description: |
                        3-letter ISO 4217 currency code for the `Rate` field.
                    RateId:
                      type: string
                      description: Applicable channel rate plan ID for this day rate.
                  required:
                    - Date
                    - Description
                    - Rate
                    - Currency
                    - RateId
              StartDate:
                type: string
                format: date
                description: Arrival date of the customer.
              EndDate:
                type: string
                format: date
                description: >
                  The date of the last night of stay (equal to departure date
                  minus one).
              Occupancy:
                type: integer
                minimum: 1
                description: >
                  Total number of persons staying in this room, including
                  children and babies. Should be the sum of `Adults`, `Children`
                  and `Babies` if those are present.
              Price:
                type: number
                minimum: 0
                description: >
                  Total price of the room, for all units and all days, including
                  taxes and fees. Example: stay is for two days and three units
                  and a single night costs €10 (including tax), then `Price` is
                  2 * 3 * 10 = 60.
              Units:
                type: integer
                minimum: 1
                description: >
                  Number of rooms booked (for private rooms) or number of beds
                  booked (for dorms/shared rooms).
              RateDesc:
                type: string
                description: >-
                  Description of the booked rate plan, as provided by the
                  channel.
              RateId:
                type: string
                description: >
                  Applicable rate plan ID for this booking. Normally there is
                  only one. If there are multiple, list them comma-separated.
            required:
              - Adults
              - Babies
              - ChannelRoomType
              - Children
              - Currency
              - DayRates
              - EndDate
              - Occupancy
              - Price
              - RateDesc
              - RateId
              - StartDate
              - Units
      required:
        - Customers
        - IsCancellation
        - IsModification
        - OrderAdults
        - OrderChildren
        - OrderCustomers
        - OrderDate
        - OrderId
        - OrderTime
        - PaymentCollect
        - Rooms
        - TotalCurrency
        - TotalPrice
    tax_conditions:
      type: array
      description: |
        Array of conditions that determine if this amount will be applied.
      items:
        type: object
        properties:
          min_start:
            type: string
            description: >
              Amount of parameter above which tax is applied. For example, if
              `condition_parameter` is "total-price" and here we have 200, this
              means that tax/fee is applied when total price is more or equal
              200.
          max_end:
            type: string
            description: >
              Amount of parameter below which tax is applied. For example, if
              `condition_parameter` is "total-price" and here we have 200, this
              means that tax/fee is applied when total price is less or equal
              200.
          one_of:
            type: array
            description: >
              List of values of a parameter. For example, if
              `condition_parameter` is "day-of-week" then ["SAT","SUN"] might be
              here.
            items:
              type: string
          max_end_inclusive:
            type: boolean
            default: true
            description: >
              Whether the `max_end` parameter is inclusive (less or equal) or
              not (strictly less).
          min_start_inclusive:
            type: boolean
            default: true
            description: >
              Whether the `min_start` parameter is inclusive (greater or equal)
              or not (strictly greater).
          condition_parameter:
            type: string
            description: >
              Parameter that determines whether this tax/fee will be applied or
              not.
            enum:
              - adult-age
              - booking-date
              - checkin-date
              - checkout-date
              - child-age
              - date-in-range
              - day-of-week
              - length-of-stay
              - night-number
              - nightly-rate
              - nights-booked-in-advance
              - number-of-guests
              - number-of-nights
              - number-of-pets
              - payment-type
              - product-code-id
              - rate-type
              - room-id
              - stay-dates-intersect
              - total-price
        required:
          - condition_parameter
    tax_info:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          description: Tax/fee ID in your PMS
        is_fee:
          type: boolean
          description: '`true` if it''s a fee, otherwise it''s a tax.'
        is_inclusive:
          type: boolean
          default: true
          description: '`true` when tax/fee included in rate.'
        is_per_night:
          type: boolean
          default: true
          description: '`true` when tax/fee is per night, otherwise per stay.'
        is_percent:
          type: boolean
          default: true
          description: '`true` when amount represents percentage, otherwise absolute value.'
        is_refundable:
          type: boolean
          default: true
          description: For example, refundable damage deposit fee will set this `true`.
        amount:
          type: number
          description: >
            Tax/fee amount. Either amount in currency or percent, depending on
            `is_percent` field. For example 20.5 can mean 20.5% or $20.5. Only
            one element either `amount` or `amounts` is supposed to be active,
            not both.
        amounts:
          type: array
          description: >
            Array of tax/fee amounts. Multiple amounts may apply at the same
            time depending on the conditions for each item. Only one element
            either `amount` or `amounts` is supposed to be active, not both.
          items:
            type: object
            properties:
              amount:
                description: >-
                  Tax/fee amount. Either amount in currency or percent,
                  depending on is_percent field. For example 20.5 can mean 20.5%
                  or $20.5.
                type: number
              conditions:
                $ref: '#/components/schemas/tax_conditions'
            required:
              - amount
        category:
          type: string
          description: |
            Tax category.
          enum:
            - occupancy_tax
            - other_fee
            - other_tax
            - resort_tax
            - sales_tax
            - service_charge
            - tourism_tax
            - vat
        code:
          type: string
          description: Issued by federal government tax/fee code.
        external_id:
          type: string
          description: >
            Optional custom field to store an external system ID. Not guaranteed
            to be unique.
        description:
          type: string
          description: Tax/fee description.
        name:
          type: string
          description: Tax/fee name.
        applies_per:
          type: string
          description: |
            To which entity tax/fee is applied.
          enum:
            - adult
            - all-adults
            - booking
            - booking-external-item
            - child
            - children
            - guest
            - pet
            - pets
            - rateplan
            - room
            - room-type
            - service
        conditions:
          $ref: '#/components/schemas/tax_conditions'
        tax_basis_includes_fees:
          type: array
          items:
            type: object
            description: >-
              Array of fee IDs which will be summed up before calculating this
              tax. Depends on calculation_basis.
            properties:
              fee_id:
                type: integer
                description: ID of a fee
                minimum: 1
            required:
              - fee_id
        calculation_basis:
          type: string
          description: >
            To what value percentage will be applied in order to calculate tax
            amount in currency. Only applicable if `is_percent` is `true`.
          enum:
            - fees
            - fees-per-night
            - rate
            - rate-and-fees
            - rate-and-fees-per-night
            - rate-per-night
      required:
        - applies_per
        - category
        - id
        - is_inclusive
        - is_per_night
        - is_percent
        - is_refundable
        - name
    response_callback_error:
      type: object
      title: Error Response
      properties:
        ErrorCode:
          type: integer
          minimum: 1
          description: >
            Error code. Check the "Error Codes" section of the specification for
            valid codes.
        Error:
          type: string
          description: Human-readable error message.
      required:
        - ErrorCode
        - Error
