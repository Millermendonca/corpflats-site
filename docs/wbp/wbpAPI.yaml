openapi: 3.1.2
info:
  title: WebBookingPro <-> PMS API
  version: '1.0'
  contact:
    url: https://www.webbookingpro.com/become-a-partner/
  license:
    name: WebBookingPro API Terms
    url: https://www.webbookingpro.com
  description: >
    # Introduction


    This API allows an PMS ("Property Manager System") to integrate with the
    WebBookingPro channel

    manager by implementing an API receiver in their environment for bookings
    and API push from their side for ARI.


    # Getting Started


    ## Becoming A Partner


    To be considered as a partner, please complete our [partnership
    form](https://www.webbookingpro.com/become-a-partner/).

    Your application will be placed in a queue to be reviewed for fit
    andcompatibility. We will reach out if the partnership is approved.


    Upon completion of the API Credentialing, you will then have access to your
    Test Account login information, 

    you will receive channel ID (`cid`), and the `shared_secret` that is
    required for the API calls.


    We request that you update our team at least once every two weeks while in
    development with your estimated completion date.


    Partners that fail to provide an estimated completion date may have their
    participation eligibility rescinded.


    Once you have finished your development process, you will be guided on
    certification integration process.


    Once you get certified, our team will inform you of the next steps,
    including providing us with:


    * Logos

    * Information about your service

    * Contact Information to various departments of your business (support,
    marketing, etc.)


    ## Flow


    If the Property is not existing already on WebBookingPro, you will have
    ability to Create Property using our API and automatically receive all
    required information needed for mapping. 


    Any existing WebBookingPro property use can add integration with your System
    through "Integrations" menu. The property owner then maps the rooms and rate
    plans in your System to complete the connection.


    After a property has been setup, you should push full refresh to
    WebBookingPro channel maanger.  This means PMS should send all availability,
    rates and restrictions

    for the next 1+ years (usually until the end of next year) for all rooms and
    rate plans. After this initial sync has been

    completed PMS should update the WebBookingPro whenever there is a change to
    ARI, eg. because a booking has been imported, room types of booking has been
    changed, price has been altered.


    PMS should poll for bookings as backup in regular configurable intervals
    (e.g. 30 minutes). Bookings can and should be sent via a callback to your
    PMS to speed up

    the import.


    In this case you have to provide us your endpoint for receiving push of
    reservations.


    # Booking Format


    The full booking format is

    [documented here]().

    Please take note of which fields are required and which fields are optional.


    # Error Codes


    You can respond with error IDs listed in our

    [error code]() list. Please

    use the numeric codes in the `ID` column. Only errors whose code starts with

    `FAULT.OTA.` are supported.


    # Rate Plans


    On the WebBookingPro channel manager rooms and rate plans have a
    many-to-many relationship. This

    means that a room can have one or more rate plans, and each rate plan can be
    used in one or more 

    rooms. For the `ARIUpdate` calls we can send different

    `wbp_rate_id` values for the same `wbp_room_id`. Rates and restrictions are

    tied to rate plans, while availability is usually (99%) tied to rooms, so
    the `units`

    will be constant across different rate plans for the same dates and for the

    same room, but rates and restrictions can vary. To close off a rate plan we

    are using the `close` flag. 


    Also there is a possibility that rate plan has it's own separater
    availability. 

    In this case you can send availabilty even on rate plan level.


    Each Rate Plan on WebBookingPro can have either separate or inherited
    pricing, seprate on inherited inventory availability, seprate or inherited
    restrictions (close, minimum stay, maximum stay).


    # FAQ


    ## Terminology


    * OTA: Online travel agency (ex: booking.com, or competitor)

    * PMS: Property Management System (your system you are integration with
    WebBookingPro)

    * cid: Channel ID - a two to four character code used by WebBookingPro
    uniquely identify an PMS. WebBookingPro will define this upon approving
    request.

    * guid: Globally unique identifier, a unique 36 character code which
    identifies a request. Useful for seeing if a request is a retry and for
    debugging.


    ## Requests


    PMS should send requests to the WebBookingPro with content-type

    `application/json`, with the payload being in the body of the request. Gzip

    compression and keep-alives will be used if supported. HTTPS

    (SSL encryption) is required for any endpoint (WebBookingPro or yours).


    HTTP response codes from WebBookingPro should always be 200. They have the

    content-type `application/json`.


    ## Required API calls


    As a minimum these API calls need to be implemented on the OTA side:


    * HealthCheck

    * SetupProperty

    * GetRoomTypes

    * GetRatePlans

    * ARIUpdate

    * GetBookingList

    * GetBookingId
servers:
  - url: https://secure.webbookingpro.com/api/cloudpms
    description: WebBookingPro endpoint
security:
  - shared_secret: []
paths:
  /HealthCheck:
    post:
      operationId: health_check
      description: >
        Called prior to `SetupProperty` or other configuration requests to
        verify proper operation. Should always return true.
      requestBody:
        content:
          application/json:
            examples:
              HealthCheck:
                summary: HealthCheck
                value:
                  verb: HealthCheck
                  wbp_property_id: ''
                  wbp_property_password: ''
                  pms_property_id: ''
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
            schema:
              type: object
              properties:
                pms_property_id:
                  oneOf:
                    - type: string
                      description: Property ID on the Your PMS if already set
                      minimum: 1
                    - type: string
                      enum:
                        - ''
                      description: Empty string otherwise if not previously setup
                wbp_property_id:
                  description: >-
                    Property ID on the WebBookinPro if already set, empty string
                    otherwise
                  type: integer
                wbp_property_password:
                  description: >-
                    Password for property on WebBookingPro if already set, empty
                    string otherwise.
                  type: string
                guid:
                  description: >-
                    Request reference ID, used for debugging and support
                    requests.
                  type: string
                  pattern: ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
                shared_secret:
                  description: >-
                    Authentication between the PMS and the WebBookingPro.
                    Identical for all requests. Not to be shared with customers.
                  type: string
                pms_cid:
                  description: PMS ID as given by WebBookingPro
                  type: string
                  pattern: ^[a-z0-9]+$
                verb:
                  type: string
                  enum:
                    - HealthCheck
              required:
                - verb
                - guid
                - pms_property_id
                - wbp_property_id
                - wbp_property_password
                - shared_secret
                - pms_cid
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                Failure:
                  summary: Failure
                  value:
                    success: false
                    errors:
                      - id: 1003
                        msg: Problems processing requests
              schema:
                $ref: '#/components/schemas/response_simple'
          description: HealthCheck
      summary: HealthCheck
  /SetupProperty:
    post:
      operationId: setup_property
      description: >-
        Check/verify/validate the credentials stored in `wbp_property_id` and

        `wbp_property_password`. If the credentials are invalid return with
        error

        ID `1001`. If the connection needs to be enabled from the WBP side first

        return with error ID `1002`.


        You can prepare UI for integration with WebBookingPro where user will be
        prompted to put in the credentials

        (`wbp_property_id` and `wbp_property_password`), which are provided by
        WebBookingPro. Both `wbp_property_id` 

        and `wbp_property_password` should be retained by

        PMS and passed in every call. 


        It is up to your system if you will be handling connection and setup of
        password manually, visible to user or not, or using CreateProperty
        operationId.
      requestBody:
        content:
          application/json:
            examples:
              SetupProperty:
                summary: SetupProperty (normal)
                value:
                  verb: SetupProperty
                  wbp_property_id: ''
                  wbp_property_password: ''
                  pms_property_id: '14524'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
              SetupProperty2:
                summary: SetupProperty (with RoomInfo)
                value:
                  verb: SetupProperty
                  wbp_property_id: ''
                  wbp_property_password: ''
                  pms_property_id: '14524'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
                  RoomInfo:
                    - pms_room_id: 45829
                      units: 5
                      beds: 2
                      dormitory: false
                      label: Double Room
                      description: A potentially long description about the room
                    - pms_room_id: 290
                      units: 25
                      maxPersons: 3
                      maxAdults: 2
                      maxChildren: 2
                      dormitory: false
                      label: 4-person private
                      description: null
            schema:
              type: object
              properties:
                pms_property_id:
                  description: Property ID on your PMS
                  type: string
                wbp_property_id:
                  type: integer
                  description: Property ID on the WebBookingPro
                wbp_property_password:
                  type: string
                  description: Password for property on WebBookingPro
                guid:
                  description: >-
                    Request reference ID, used for debugging and support
                    requests.
                  type: string
                  pattern: ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
                shared_secret:
                  description: >-
                    Authentication between the PMS and the WebBookingPro.
                    Identical for all requests. Not to be shared with customers.
                  type: string
                pms_cid:
                  description: PMS ID as given by WebBookingPro
                  type: string
                  pattern: ^[a-z0-9]+$
                verb:
                  type: string
                  enum:
                    - SetupProperty
                RoomInfo:
                  type: array
                  description: >
                    This list should contain of rooms enabled for the the
                    Channel Manager. By default this is not present. It's only
                    necessary for deep integrations or situations where the
                    WebBookingPro plans to automatically/create destroy rooms
                    using the PMS configuration. In a normal integration this
                    isn't very usual.
                  items:
                    $ref: '#/components/schemas/room_info'
              required:
                - verb
                - guid
                - pms_property_id
                - wbp_property_id
                - shared_secret
                - pms_cid
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                Failure:
                  summary: Failure (invalid credentials)
                  value:
                    success: false
                    errors:
                      - id: 1001
                        msg: The login details you provided are incorrect.
                Failure2:
                  summary: Failure (CM not enabled)
                  value:
                    success: false
                    errors:
                      - id: 1002
                        msg: Credentials not enabled for channel management.
              schema:
                $ref: '#/components/schemas/response_simple'
          description: SetupProperty
      summary: SetupProperty
  /GetRoomTypes:
    post:
      operationId: get_room_types
      description: Returns a list of rooms configured for the passed credentials.
      requestBody:
        content:
          application/json:
            examples:
              GetRoomTypes:
                summary: GetRoomTypes (normal)
                value:
                  verb: GetRoomTypes
                  wbp_property_id: 1111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
              GetRoomTypes2:
                summary: GetRoomTypes (with RoomInfo)
                value:
                  verb: GetRoomTypes
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
                  RoomInfo:
                    - pms_room_id: 45829
                      units: 5
                      maxPersons: 2
                      dormitory: false
                      label: Double Room
                      description: A potentially long description about the room
                    - pms_room_id: 290
                      units: 25
                      maxPersons: 4
                      dormitory: false
                      label: 4-person private
                      description: null
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - GetRoomTypes
                    RoomInfo:
                      type: array
                      description: >
                        This list of rooms will only be returned if enabled for
                        the WebBookingPro by your PMS. By default this is not
                        present. It's only necessary for deep integrations or
                        situations where the PMS plans to automatically/create
                        destroy rooms using PMS configuration. In a normal
                        integration this isn't very usual.
                      items:
                        $ref: '#/components/schemas/room_info'
              required:
                - verb
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    Rooms:
                      - wbp_room_id: 111
                        label: 6-bed shared dorm
                        maxPersons: 6
                        dorm: true
                      - wbp_room_id: 112
                        label: 5-person private
                        maxPersons: 5
                        dorm: false
                Failure:
                  summary: Invalid credentials sent
                  value:
                    success: false
                    errors:
                      - id: 1001
                        msg: The login details you provided are incorrect.
              schema:
                oneOf:
                  - type: object
                    title: Successful room retrieval
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
                      Rooms:
                        type: array
                        description: |
                          List of rooms on the WebBookingPro.
                        items:
                          type: object
                          properties:
                            wbp_room_id:
                              type: integer
                              description: Room ID on the WebBookingPro
                            label:
                              type: string
                              description: Name, label or short summary of the room type
                            maxPersons:
                              type: integer
                              minimum: 1
                              description: Number of people that can stay in this room.
                            dorm:
                              type: boolean
                              description: If `true` the room is a dormitory/shared room.
                          required:
                            - wbp_room_id
                            - title
                    required:
                      - success
                      - Rooms
                  - $ref: '#/components/schemas/response_error'
          description: GetRoomTypes
      summary: GetRoomTypes
  /GetRatePlans:
    post:
      operationId: get_rate_plans
      description: |-
        PMS should use this call to retrieve a list of rate plans, which are
        either specific to each room, or global for all rooms.
      requestBody:
        content:
          application/json:
            examples:
              GetRatePlans:
                summary: GetRatePlans
                value:
                  verb: GetRatePlans
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - GetRatePlans
              required:
                - verb
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success - specific rate plans per room
                  value:
                    success: true
                    RatePlans:
                      - wbp_room_id: DR_556
                        wbp_rate_id: DEF_9910
                        title: Default Rate Plan
                      - wbp_room_id: PR_1952
                        wbp_rate_id: NRF_7001
                        title: Non-refundable rate
                Success2:
                  summary: Success - global rate plans
                  value:
                    success: true
                    RatePlans:
                      - wbp_room_id: '0'
                        wbp_rate_id: DEF_9910
                        title: Default Rate Plan
                      - wbp_room_id: '0'
                        wbp_rate_id: NRF_7001
                        title: Non-refundable rate
                Failure:
                  summary: Invalid credentials sent
                  value:
                    success: false
                    errors:
                      - id: 1001
                        msg: The login details you provided are incorrect.
              schema:
                oneOf:
                  - type: object
                    title: Successful rate plan retrieval
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
                      RatePlans:
                        type: array
                        description: |
                          List of rate plans on the OTA.
                        items:
                          type: object
                          properties:
                            wbp_room_id:
                              type: string
                              description: >
                                Room ID on the OTA tied to the rate plan. If the
                                rate plan is available to all rooms set this to
                                `0`.
                            wbp_rate_id:
                              type: string
                              description: >-
                                Rate plan ID on the OTA.  Cannot be `0`, empty
                                string or otherwise falsy.
                            title:
                              type: string
                              description: Name, label or short summary of the rate plan
                          required:
                            - wbp_room_id
                            - wbp_rate_id
                            - title
                    required:
                      - success
                      - RatePlans
                  - $ref: '#/components/schemas/response_error'
          description: GetRatePlans
      summary: GetRatePlans
  /GetPromotions:
    post:
      operationId: get_promotions
      description: PMS should use this call to retrieve a list of all promotions
      requestBody:
        content:
          application/json:
            examples:
              GetPromotions:
                summary: GetPromotions
                value:
                  verb: GetPromotions
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - GetPromotions
              required:
                - verb
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success - all promotions
                  value:
                    success: true
                    Promotions:
                      - wbp_promotion_id: 111
                        is_active: 1
                        title: Long Stay Discount
                      - wbp_promotion_id: 112
                        is_active: 1
                        title: Last minute Discount
                Failure:
                  summary: Invalid credentials sent
                  value:
                    success: false
                    errors:
                      - id: 1001
                        msg: The login details you provided are incorrect.
              schema:
                oneOf:
                  - type: object
                    title: Successful rate plan retrieval
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
                      Promotions:
                        type: array
                        description: |
                          List of all promotions on WebBookingPro
                        items:
                          type: object
                          properties:
                            wbp_promotion_id:
                              type: integer
                              description: |
                                WBP Promotion ID
                            is_active:
                              type: boolean
                              description: Promotion Active status
                            title:
                              type: string
                              description: Name, label or short summary of the promotion
                          required:
                            - wbp_promotion_id
                            - title
                            - is_active
                    required:
                      - success
                      - Promotions
                  - $ref: '#/components/schemas/response_error'
          description: GetPromotions
      summary: GetPromotions
      tags:
        - Promotions
  /SetPromotion:
    post:
      operationId: update_promotion
      description: PMS should use this call to update exact promotion
      requestBody:
        content:
          application/json:
            examples:
              SetPromotion:
                summary: SetPromotion
                value:
                  verb: SetPromotion
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
                  wbp_promotion_id: 121
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - SetPromotion
              required:
                - verb
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success - all promotions
                  value:
                    success: true
                Failure:
                  summary: Invalid credentials sent
                  value:
                    success: false
                    errors:
                      - id: 1001
                        msg: The login details you provided are incorrect.
              schema:
                oneOf:
                  - type: object
                    title: Successful rate plan retrieval
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
                    required:
                      - success
                  - $ref: '#/components/schemas/response_error'
          description: SetPromotion
      summary: SetPromotion
      tags:
        - Promotions
  /RemovePromotion:
    post:
      operationId: delete_promotion
      description: PMS should use this call to delete exact promotion
      requestBody:
        content:
          application/json:
            examples:
              DeletePromotion:
                summary: RemovePromotion
                value:
                  verb: RemovePromotion
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
                  wbp_promotion_id: 121
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - RemovePromotion
              required:
                - verb
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success - all promotions
                  value:
                    success: true
                    Promotions:
                      - wbp_promotion_id: 111
                        is_active: 1
                        title: Long Stay Discount
                      - wbp_promotion_id: 112
                        is_active: 1
                        title: Last minute Discount
                Failure:
                  summary: Invalid credentials sent
                  value:
                    success: false
                    errors:
                      - id: 1001
                        msg: The login details you provided are incorrect.
              schema:
                oneOf:
                  - type: object
                    title: Successful rate plan retrieval
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
                      Promotions:
                        type: array
                        description: |
                          List of all promotions on WebBookingPro
                        items:
                          type: object
                          properties:
                            wbp_promotion_id:
                              type: integer
                              description: |
                                WBP Promotion ID
                            is_active:
                              type: boolean
                              description: Promotion Active status
                            title:
                              type: string
                              description: Name, label or short summary of the promotion
                          required:
                            - wbp_promotion_id
                            - title
                            - is_active
                    required:
                      - success
                      - Promotions
                  - $ref: '#/components/schemas/response_error'
          description: RemovePromotion
      summary: RemovePromotion
      tags:
        - Promotions
  /GetChannels:
    post:
      operationId: get_channels
      description: PMS should use this call to retrieve a list of all Channels
      requestBody:
        content:
          application/json:
            examples:
              GetChannels:
                summary: GetChannels
                value:
                  verb: GetChannels
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - GetChannels
              required:
                - verb
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success - all Channels
                  value:
                    success: true
                    Channels:
                      - wbp_channel_id: 111
                        is_active: 1
                        title: Long Stay Discount
                      - wbp_channel_id: 112
                        is_active: 1
                        title: Last minute Discount
                Failure:
                  summary: Invalid credentials sent
                  value:
                    success: false
                    errors:
                      - id: 1001
                        msg: The login details you provided are incorrect.
              schema:
                oneOf:
                  - type: object
                    title: Successful rate plan retrieval
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
                      Channels:
                        type: array
                        description: |
                          List of all Channels on WebBookingPro
                        items:
                          type: object
                          properties:
                            wbp_channel_id:
                              type: integer
                              description: |
                                WBP Channel ID
                            is_active:
                              type: boolean
