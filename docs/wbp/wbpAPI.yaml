                            pms_room_id:
                              type: integer
                              minimum: 1
                              description: Room ID on your PMS
                            wbp_rate_id:
                              type: string
                              description: WebBookingPro rate plan ID
                            pms_rate_id:
                              type: integer
                              minimum: 0
                              description: Rate plan ID on your PMS
                          required:
                            - wbp_room_id
                            - pms_room_id
                    required:
                      - success
                      - wbp_property_id
                  - $ref: '#/components/schemas/response_error'
          description: CreateProperty
