  /ARIUpdate:
    post:
      operationId: ari_update
      description: >-
        This call is used to send availability, rates and restrictions to your
        OTA.

        We will combine the updates into as few date ranges as possible, and we

        split bigger updates into several API requests. We also cache data and
        will

        not send ARI updates if the ARI data has not changed within a certain

        timeframe. You can ask us to alter the number of `Inventory` objects we
        send

        per request. It's also possible to ask us to restrict maximum number of
        days

        per date range.
      requestBody:
        content:
          application/json:
            examples:
              ARIUpdate:
                summary: ARIUpdate
                value:
                  verb: ARIUpdate
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  currency: USD
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
                  Inventory:
                    - wbp_room_id: '61365'
                      wbp_rate_id: rate_456
                      start_date: '2025-01-22'
                      end_date: '2025-02-12'
                      units: 5
                      rate: '15.00'
                      rdef_single: '12.00'
                      max_los: 14
                      min_los: 2
                      closearr: false
                      closedep: false
                      close: false
                      min_advanced_offset: 2
                      max_advanced_offset: 30
                      num_adults_included: 2
                      num_children_included: 2
                      adult_3: '8.00'
                      child_3: '5.00'
                    - wbp_room_id: '61365'
                      wbp_rate_id: rate_888
                      start_date: '2025-01-22'
                      end_date: '2025-02-12'
                      units: 5
                      rate: '30.00'
                      close: true
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - ARIUpdate
                    currency:
                      type: string
                      pattern: ^[A-Z]{3}$
                      description: >
                        3-letter ISO 4217 currency code. This is the currency
                        the property has set for the channel connection, and may
                        differ from the property's native currency. The OTA can
                        use this field to assert that rates are sent in the
                        correct currency.
                    Inventory:
                      type: array
                      items:
                        type: object
                        properties:
                          wbp_room_id:
                            type: string
                            description: Room ID on the OTA.
                          wbp_rate_id:
                            type: string
                            description: Rate plan ID on the OTA
                          start_date:
                            type: string
                            format: date
                            description: Start date for when the sent ARI is applicable.
                          end_date:
                            type: string
                            format: date
                            description: >
                              End date for when the sent ARI is applicable. Note
                              that this date is inclusive. For example, if the
                              `end_date` is 2028-08-29 and we send `rate` =
                              `20.15`, then this rate is applicable for someone
                              staying/arriving on 2028-08-29.
                          units:
                            type: integer
                            minimum: 0
                            description: >
                              Number of rooms bookable (available) for private
                              rooms, or for the number of beds for shared/dorm
                              rooms.
                          rate:
                            type: string
                            pattern: ^\d+(\.\d+)?$
                            description: |
                              Price per unit for a single night.
                          rdef_single:
                            type: string
                            pattern: ^\d+(\.\d+)?$
                            description: >
                              The single use rate, if only one person is
                              staying. This will only be present for private
                              rooms, and only if the occupancy of this room is
                              higher than `1`. If the value is `0` we recommend
                              to not make the single use rate available, or to
                              just use the same price as for `rate`.
                          num_adults_included:
                            type: integer
                            minimum: 0
                            description: >
                              Number of adults included in base rate. Sent for
                              OBP enabled channels.
                          num_children_included:
                            type: integer
                            minimum: 0
                            description: >
                              Number of children included in base rate. Sent for
                              OBP enabled channels.
                          max_los:
                            type: integer
                            minimum: 0
                            description: >-
                              Maximum length of stay. A guest should not be able
                              to

                              book if they selected more nights than this value.
                              A

                              value of `0` means that there is no restriction.


                              There are two ways to restrict bookings by this
                              value:

                              a) Check the `max_los` value for the arrival date,

                              or b) check the `max_los` value for all days the
                              guest

                              is intending to stay and restrict by the lowest
                              value.
                          min_los:
                            type: integer
                            minimum: 1
                            description: >-
                              Minimum length of stay. A guest should not be able
                              to

                              book if they selected fewer nights than this
                              value.


                              There are two ways to restrict bookings by this
                              value:

                              a) Check the `min_los` value for the arrival date,

                              or b) check the `min_los` value for all days the
                              guest

                              is intending to stay and restrict by the lowest
                              value.
                          closearr:
                            type: boolean
                            description: >
                              Restricts whether a guest can arrive within the
                              specified date range. If `true` the guest can stay
                              and depart within the date range, but not arrive.
                          closedep:
                            type: boolean
                            description: >
                              Restricts whether a guest can depart within the
                              specified date range. If `true` the guest can stay
                              and arrive within the date range, but not depart.
                          close:
                            type: boolean
                            description: >
                              Restricts whether a guest can stay within the
                              specified date range. If `true` the guest cannot
                              arrive, stay or depart within the date range. In
                              many cases this is equivalent to `units` = 0,
                              however it is also used to make specific rate
                              plans unavailable while leaving others bookable.
                          min_advanced_offset:
                            type: integer
                            minimum: 0
                            description: >
                              Cut off restriction: Specifies the number of days
                              before the arrival date guests are allowed to
                              book. The value of 0 resets to no restriction,
                              which is the default. This restriction is mainly
                              used for properties that want to have a lot of
                              advanced bookings by offering a heavily discounted
                              rate if guests book at least X number of days in
                              advance.
                          max_advanced_offset:
                            type: integer
                            minimum: 0
                            description: >
                              Last Minute restriction: The number of days before
                              the arrival date guests can book. The value of 0
                              resets to no restriction, which is the default.
                              This restriction is mainly used to boost
                              last-minute reservations.
                        patternProperties:
                          ^adult_\d+$:
                            type: string
                            pattern: ^\d+(\.\d+)?$
                            description: >-
                              Extra price for the Nth adult (e.g., adult_3,
                              adult_4). Sent for OBP enabled channels.
                          ^child_\d+$:
                            type: string
                            pattern: ^\d+(\.\d+)?$
                            description: >-
                              Extra price for the Nth child (e.g., child_3,
                              child_4). Sent for OBP enabled channels.
                        required:
                          - wbp_room_id
                          - wbp_rate_id
                          - start_date
                          - end_date
              required:
                - verb
                - currency
                - Inventory
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                Failure:
                  summary: Incorrect currency settings
                  value:
                    success: false
                    errors:
                      - id: 1102
                        msg: >
                          Your currency setting doesn't match the channel's
                          currency setting. Transmitted: EUR. Setting on OTA:
                          USD.
              schema:
                $ref: '#/components/schemas/response_simple'
          description: ARIUpdate
      summary: ARIUpdate
  /GetBookingList:
    post:
      operationId: get_booking_list
      description: >-
        Returns a list of bookings/reservations which have not been previously

        downloaded or have been modified.


        The pull interval can be freely set. For channels that do not support
        the

        `CreateBooking` callback the interval is usually set to pull bookings
        every

        5 minutes. If `CreateBooking` is supported then the `GetBookingList`
        will

        be used as a fallback every 30 minutes.


        The WebBookingPro can also send to your PMS a `NotifyBooking` callback
        to inform about

        new bookings available to be polled.
      requestBody:
        content:
          application/json:
            examples:
              GetBookingList:
                summary: GetBookingList
                value:
                  verb: GetBookingList
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
                  wbp_booking_version: '2022-03-22 12:09:19'
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - GetBookingList
                    wbp_booking_version:
                      type:
                        - string
                        - 'null'
                      description: >-
                        With each request we send along `wbp_booking_version`,
                        which

                        has the format `YYYY-MM-DD HH:MM:SS` and indicates the
                        time

                        in UTC we last successfully requested bookings. It can
                        be

                        `null` if no successful response has been received so

                        far. Please use `wbp_booking_version` to only return to
                        us

                        new or modified bookings made since then. To ensure that
                        no

                        booking are skipped due to a time-offset between your
                        and

                        our servers make sure to always reduce 5 or more minutes

                        from the time given. Example: we provide 2017-06-22

                        12:09:19, then please return all new/modified/cancelled

                        bookings since 2017-06-22 12:04:19 (5 minutes before the

                        time sent).


                        If `wbp_booking_version` is `null` please return all
                        bookings.
              required:
                - verb
                - wbp_booking_version
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    Bookings:
                      - booking_id: B84372-281192312
                        version: '1'
                      - booking_id: B84372-281192314
                        version: '2'
                      - booking_id: H1238-99825634
                        version: '1'
                Failure:
                  summary: Invalid credentials sent
                  value:
                    success: false
                    errors:
                      - id: 1001
                        msg: The login details you provided are incorrect.
              schema:
                oneOf:
                  - type: object
                    title: Successful booking list retrieval
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
                      Bookings:
                        type: array
                        description: |
                          List of bookings to be retrieved with `GetBookingId`.
                        items:
                          type: object
                          properties:
                            booking_id:
                              type: string
                              description: >-
                                Unique booking ID on the OTA. Maximum of 64
                                characters.
                            version:
                              type: string
                              description: >
                                Most recent version number of the booking, if
                                the OTA wants to support retrieval of different
                                versions of bookings. Not commonly implemented.
                          required:
                            - booking_id
                    required:
                      - success
                      - Bookings
                  - $ref: '#/components/schemas/response_error'
          description: GetBookingList
      summary: GetBookingList
  /GetBookingId:
    post:
      operationId: get_booking_id
      description: >-
        Returns detailed bookings made on WebBookingPro.


        The booking format is described

        [here in full detail]().


        Most fields are optional. This specification lists only the minimum
        required

        fields to be eligible for a successful Build-To-Us integration.


        Prices: Send us sell rates (rates including taxes and fees). The sum of
        all

        room prices should equal the `TotalPrice` field. Day rates should be per

        unit, so the sum of all day rates multiplied by the number of units
        should

        equal the room price.


        Country codes: For CustomerCountry and CustomerNationality (if you
        include

        those fields) make sure to pass the country code as uppercase Alpha-2

        ISO-3166 codes.


        Currency codes: Make sure they are valid ISO-4217 (uppercase).


        Make sure to provide `OrderDate` and `OrderTime`. They have to be
        provided in

        UTC.


        Guest's credit/debit card details can be provided with the `Payments`
        field.
      requestBody:
        content:
          application/json:
            examples:
              GetBookingId:
                summary: GetBookingId
                value:
                  verb: GetBookingId
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
                  booking_id: 111
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - GetBookingId
                    booking_id:
                      type: string
                      description: |
                        OTA booking ID of the booking to be retrieved.
              required:
                - verb
                - booking_id
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    reservation:
                      OrderId: '123456789'
                      OrderDate: '2018-04-22'
                      OrderTime: '18:02:58'
                      IsCancellation: 0
                      IsModification: 0
