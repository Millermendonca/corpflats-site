  /CancelBooking:
    post:
      operationId: cancel_booking
      description: >-
        Allows a property to cancel a booking on WebBookingPro from the PMS
        side.


        *IMPORTANT*: Please contact us to enable this capability for your
        channel. It

        is NOT enabled by default.


        The reason why the booking is to be canceled is given in the reason
        field.

        If the booking cannot be canceled the error code should be provided.
        Here

        are possible error codes:


        * 4001 - booking has already departed

        * 4002 - booking is already canceled

        * 4003 - booking cannot be canceled. The reason is provided in the `msg`
        field.
      requestBody:
        content:
          application/json:
            examples:
              CancelBooking:
                summary: CancelBooking
                value:
                  verb: CancelBooking
                  wbp_property_id: 111
                  wbp_property_password: very-secret-password
                  pms_property_id: '25678'
                  guid: 6C08B96E-450D-4E6A-9933-7D0305730305
                  pms_cid: mycloudpms1
                  shared_secret: s3cr3ts4uc3
                  booking_id: H7736-29385551
                  reason: Guest called and requested cancellation
            schema:
              allOf:
                - $ref: '#/components/schemas/auth'
                - type: object
                  properties:
                    verb:
                      type: string
                      enum:
                        - CancelBooking
                    booking_id:
                      type: string
                      description: |
                        OTA booking ID of the booking to be cancelled.
                    reason:
                      type: string
                      description: >
                        Free text reason given by property as to why the booking
                        was cancelled.
              required:
                - verb
                - booking_id
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Failure:
                  summary: Booking has already departed
                  value:
                    success: false
                    errors:
                      - id: 4001
                        msg: Booking has already departed
                Success:
                  summary: Success
                  value:
                    success: true
              schema:
                $ref: '#/components/schemas/response_simple'
          description: CancelBooking
      summary: CancelBooking
