kind = "mobile"
previewPath = "/camareiras/"
title = "Camareiras"
description = "App móvel nativo para camareiras do hotel. Permite visualizar e gerenciar os flats do dia (dashboard de cards com status de limpeza), executar tarefas periódicas de manutenção, e registrar observações de defeitos ou problemas nos apartamentos. Usa o mesmo backend e banco de dados do web app existente."
version = "1.0.0"
id = "artifacts/camareiras"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/camareiras/" ]
localPort = 19666

[services.development]
run = "pnpm --filter @workspace/camareiras run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/camareiras", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/camareiras", "run", "serve" ]

[services.env]
PORT = "19666"
BASE_PATH = "/camareiras/"
